<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Crossword Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#eeeeee;
    --paper-2:#e2e2e2;
    --card:#ffffff;
    --ink:#222831;
    --ink-2:#222831;
    --muted:#6d7278;
    --accent:#d65a31;
    --accent-lite:#f7cdbb;
    --dark:#393e46;
    --line:#d8d8d8;
    --shadow:rgba(34,40,49,.14);
    --fd:"Space Grotesk",system-ui,sans-serif;
    --fb:"Poppins",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100dvh}
  body{
    font-family:var(--fb);color:var(--ink);
    background:var(--paper);
    overflow-x:hidden;
  }
  canvas#rain{position:fixed;inset:0;z-index:0;pointer-events:none}
  canvas#fx{position:fixed;inset:0;z-index:80;pointer-events:none}

  .wrap{max-width:640px;margin:0 auto;padding:22px 18px 60px;position:relative;z-index:2}

  header{text-align:center;margin:6px 0 18px;position:relative;z-index:3}
  h1{
    font-family:var(--fd);font-weight:700;
    font-size:clamp(26px,7vw,38px);color:var(--ink);margin:0;
    letter-spacing:-.01em;
  }
  header p{margin:8px 0 0;color:var(--accent);font-size:clamp(15px,4vw,19px);font-weight:600}

  .hud{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 20px}
  .chip{
    display:flex;align-items:center;gap:8px;background:var(--card);
    border:1px solid var(--line);border-radius:999px;padding:8px 15px;
    box-shadow:0 6px 16px var(--shadow);font-size:14px;font-weight:600;color:var(--ink)
  }
  .chip b{color:var(--accent)}
  .snd{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);
       cursor:pointer;font-size:17px;box-shadow:0 6px 16px var(--shadow)}

  /* board */
  .board-card{
    background:var(--card);border:1px solid var(--line);border-radius:24px;
    padding:22px 16px;box-shadow:0 20px 50px var(--shadow);position:relative;overflow:hidden;
  }
  .grid-scroll{overflow:auto;display:flex;justify-content:center}
  .grid{
    direction:ltr;display:grid;gap:4px;margin:4px auto;position:relative;
    --cs:38px;
    grid-template-columns:repeat(8,var(--cs));
    grid-auto-rows:var(--cs);
  }
  @media(max-width:460px){ .grid{--cs:33px;gap:3px} }
  @media(max-width:360px){ .grid{--cs:29px} }

  .cell{position:relative;border-radius:7px;display:grid;place-items:center;
        font-family:var(--fd);font-weight:700;font-size:calc(var(--cs)*.5);color:var(--ink-2);
        background:#fff;border:1.5px solid var(--line);cursor:pointer;
        box-shadow:inset 0 -2px 0 rgba(0,0,0,.03);
        transition:transform .12s, box-shadow .2s, background .2s, border-color .2s}
  .cell:hover{transform:translateY(-1px);border-color:var(--accent)}
  .cell .n{position:absolute;top:1px;left:3px;font-family:var(--fb);font-weight:600;
           font-size:calc(var(--cs)*.26);color:var(--muted);line-height:1}
  .cell.sel{border-color:var(--ink);box-shadow:0 0 0 2px rgba(34,40,49,.2)}
  .cell.hl{background:var(--accent-lite);border-color:var(--accent)}
  .cell.done{background:linear-gradient(160deg,#ffe4d8,var(--accent-lite));border-color:var(--accent);color:var(--ink-2)}
  .cell.pop{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
  @keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
  .cell.blank{visibility:hidden;pointer-events:none}

  /* clue list */
  .clues{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){ .clues{grid-template-columns:1fr} }
  .clue-btn{
    text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:11px 13px;cursor:pointer;display:flex;gap:10px;align-items:center;
    box-shadow:0 4px 12px var(--shadow);transition:transform .12s,border-color .2s;font-family:var(--fb)
  }
  .clue-btn:hover{transform:translateY(-2px);border-color:var(--accent)}
  .clue-btn .badge{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--paper-2);
        color:var(--ink);font-weight:700;display:grid;place-items:center;font-size:13px}
  .clue-btn .em{font-size:19px}
  .clue-btn .tx{font-size:13.5px;color:var(--ink);font-weight:500;line-height:1.35}
  .clue-btn.solved{background:var(--accent-lite);border-color:var(--accent)}
  .clue-btn.solved .badge{background:var(--accent);color:#fff}

  /* modal */
  .scrim{position:fixed;inset:0;z-index:70;background:rgba(34,40,49,.5);backdrop-filter:blur(4px);
         display:none;align-items:center;justify-content:center;padding:18px}
  .scrim.show{display:flex}
  .modal{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);
         border-radius:22px;padding:22px 20px;box-shadow:0 30px 60px rgba(0,0,0,.3);
         position:relative;animation:rise .3s ease}
  @keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
  .m-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .m-em{font-size:34px;width:56px;height:56px;flex:0 0 56px;display:grid;place-items:center;
        background:var(--paper-2);border-radius:16px}
  .m-dir{font-size:12px;color:var(--accent);font-weight:700}
  .m-q{font-size:clamp(16px,4.5vw,19px);font-weight:600;color:var(--ink);line-height:1.4;margin:2px 0 0}
  .m-boxes{direction:ltr;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:18px 0 8px}
  .m-box{width:40px;height:48px;border-radius:10px;border:1.5px solid var(--line);background:#fff;
         text-align:center;font-family:var(--fd);font-weight:700;font-size:22px;color:var(--ink-2);
         text-transform:uppercase;outline:none;caret-color:var(--accent)}
  @media(max-width:400px){ .m-box{width:34px;height:42px;font-size:19px} }
  .m-box:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(34,40,49,.15)}
  .m-box.lock{background:var(--accent-lite);border-color:var(--accent);color:var(--ink)}
  .m-boxes.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .m-msg{min-height:18px;text-align:center;font-size:13px;color:var(--muted)}
  .m-msg.ok{color:var(--accent);font-weight:700}
  .m-actions{display:flex;gap:10px;margin-top:14px}
  .btn{border:none;cursor:pointer;font-family:var(--fb);font-weight:700;font-size:15px;
       padding:12px 18px;border-radius:13px;transition:transform .12s,filter .2s}
  .btn:active{transform:scale(.97)}
  .btn.go{flex:1;background:var(--ink);color:#fff;box-shadow:0 10px 22px rgba(34,40,49,.3)}
  .btn.go:hover{filter:brightness(1.15)}
  .btn.soft{background:var(--paper-2);color:var(--ink)}
  .m-close{position:absolute;top:12px;right:14px;border:none;background:transparent;cursor:pointer;
           font-size:20px;color:var(--muted)}
  .toggle{display:flex;gap:6px;margin-top:10px;justify-content:center}
  .toggle button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;
                 font-family:var(--fb);font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer}
  .toggle button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* finale */
  .finale{position:fixed;inset:0;z-index:75;display:none;align-items:center;justify-content:center;padding:22px;
          background:radial-gradient(120% 120% at 50% 20%, rgba(214,90,49,.35), rgba(34,40,49,.94));
          opacity:0;transition:opacity .7s}
  .finale.show{display:flex;opacity:1}
  .rev{max-width:640px;text-align:center;color:#fff}
  .rev .crest{font-size:48px;transform:scale(.4);opacity:0;transition:transform .8s cubic-bezier(.2,1.4,.3,1),opacity .8s}
  .rev.s1 .crest{transform:scale(1);opacity:1}
  .rev .en{font-family:var(--fd);font-weight:700;font-size:clamp(20px,5.6vw,30px);letter-spacing:-.01em;margin:16px 0 4px;
           color:#fff;opacity:0;transform:translateY(16px);transition:.8s .15s}
  .rev.s2 .en{opacity:1;transform:none}
  .rev .loc{margin-top:10px;color:#f2d9cd;font-weight:600;opacity:0;transition:.8s .5s}
  .rev.s2 .loc{opacity:1}
  .rev .fbtns{display:flex;gap:12px;justify-content:center;margin-top:26px;opacity:0;transition:.8s .7s}
  .rev.s2 .fbtns{opacity:1}
  .rev .btn.go{background:var(--accent);color:#fff}
  .rev .btn.soft{background:rgba(255,255,255,.16);color:#fff}

  .backlink{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;font-size:13px;font-weight:600;
    color:var(--muted);text-decoration:none}
  .backlink:hover{color:var(--ink)}
</style>
</head>
<body>

<canvas id="rain"></canvas>

<div class="wrap">
  <a class="backlink" href="index.html">← Back to site</a>
  <header>
    <h1>Crossword Puzzle</h1>
    <p>Think you can solve it? ✏️</p>
  </header>

  <div class="hud">
    <div class="chip"><span>Words found</span><b id="count">0</b><span>/ 5</span></div>
    <button class="snd" id="snd" title="Sound">🔊</button>
  </div>

  <div class="board-card">
    <div class="grid-scroll">
      <div class="grid" id="grid"></div>
    </div>
    <div class="clues" id="clues"></div>
  </div>
</div>

<!-- solving modal -->
<div class="scrim" id="scrim">
  <div class="modal">
    <button class="m-close" id="mClose">✕</button>
    <div class="m-top">
      <div class="m-em" id="mEm">❔</div>
      <div>
        <div class="m-dir" id="mDir">—</div>
        <p class="m-q" id="mQ">—</p>
      </div>
    </div>
    <div class="toggle" id="mToggle"></div>
    <div class="m-boxes" id="mBoxes"></div>
    <div class="m-msg" id="mMsg">Type your answer.</div>
    <div class="m-actions">
      <button class="btn go" id="mCheck">Check</button>
      <button class="btn soft" id="mHint">Hint</button>
    </div>
  </div>
</div>

<!-- finale -->
<div class="finale" id="finale">
  <div class="rev" id="rev">
    <div class="crest">🎓✨</div>
    <div class="en">University of Technology and Applied Sciences</div>
    <div class="loc">Sultanate of Oman 🇴🇲</div>
    <div class="fbtns">
      <button class="btn go" id="fAgain">Celebrate again</button>
      <button class="btn soft" id="fReplay">Play again</button>
    </div>
  </div>
</div>

<canvas id="fx"></canvas>

<script>
(function(){
  "use strict";

  const ROWS=13, COLS=8;
  const ENTRIES=[
    {word:"OMAN",       num:1, r:0, c:0, dir:"across", em:"🇴🇲",
      q:"Our beloved country in the Gulf, capital Muscat."},
    {word:"APPLIED",    num:2, r:0, c:2, dir:"down",   em:"🔧",
      q:"The kind of science we put to real use, not just theory."},
    {word:"UNIVERSITY", num:3, r:3, c:4, dir:"down",   em:"🎓",
      q:"Where you study after school to earn a higher degree."},
    {word:"TECHNOLOGY", num:4, r:3, c:6, dir:"down",   em:"💻",
      q:"Computers, robots, and the internet all belong to this."},
    {word:"SCIENCES",   num:5, r:4, c:0, dir:"across", em:"🔬",
      q:"Physics, chemistry, and biology are all called this."}
  ];

  let soundOn=true, cur=null, altList=[];
  const $=s=>document.querySelector(s);

  // ---- build cell maps ----
  const cellData={};
  function key(r,c){return r+","+c;}
  ENTRIES.forEach((e,idx)=>{
    e.cells=[]; e.solved=false;
    for(let i=0;i<e.word.length;i++){
      const r=e.r+(e.dir==="down"?i:0), c=e.c+(e.dir==="across"?i:0);
      const k=key(r,c);
      if(!cellData[k]) cellData[k]={r,c,letter:e.word[i],filled:"",el:null};
      cellData[k][e.dir]=idx;
      if(i===0) cellData[k].num=e.num;
      e.cells.push(k);
    }
  });

  // ---- render grid ----
  const gridEl=$("#grid");
  function buildGrid(){
    gridEl.innerHTML="";
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        const k=key(r,c), d=cellData[k];
        const cell=document.createElement("div");
        cell.style.gridRow=(r+1); cell.style.gridColumn=(c+1);
        if(!d){ cell.className="cell blank"; gridEl.appendChild(cell); continue; }
        cell.className="cell"; cell.dataset.k=k;
        if(d.num) cell.innerHTML='<span class="n">'+d.num+'</span>';
        d.el=cell;
        cell.addEventListener("click",()=>onCellClick(k));
        gridEl.appendChild(cell);
      }
    }
    paint();
  }
  function paint(){
    Object.values(cellData).forEach(d=>{
      const base=(d.el.innerHTML.indexOf('class="n"')>-1)?'<span class="n">'+d.num+'</span>':'';
      d.el.className="cell"+(d.filled?" done":"");
      d.el.innerHTML=base+(d.filled?d.filled:"");
    });
  }

  // ---- clue list ----
  const cluesEl=$("#clues");
  function buildClues(){
    cluesEl.innerHTML="";
    ENTRIES.forEach((e,idx)=>{
      const b=document.createElement("button");
      b.className="clue-btn"+(e.solved?" solved":"");
      b.dataset.idx=idx;
      b.innerHTML='<span class="badge">'+e.num+'</span><span class="em">'+e.em+'</span>'+
                  '<span class="tx">'+e.q+'</span>';
      b.addEventListener("click",()=>openWord(idx));
      cluesEl.appendChild(b);
    });
  }

  function onCellClick(k){
    const d=cellData[k];
    const opts=[];
    if(d.across!=null) opts.push(d.across);
    if(d.down!=null) opts.push(d.down);
    const unsolved=opts.filter(i=>!ENTRIES[i].solved);
    const pick=(unsolved.length?unsolved:opts)[0];
    altList=opts;
    openWord(pick);
  }

  // ---- modal ----
  const scrim=$("#scrim"), mEm=$("#mEm"), mDir=$("#mDir"), mQ=$("#mQ"),
        mBoxes=$("#mBoxes"), mMsg=$("#mMsg"), mToggle=$("#mToggle");
  let boxes=[];
  function openWord(idx){
    cur=idx;
    const e=ENTRIES[idx];
    if(!altList.includes(idx)) altList=[idx];
    mEm.textContent=e.em;
    mDir.textContent=(e.dir==="across"?"Across":"Down")+" • "+e.word.length+" letters";
    mQ.textContent=e.q;
    mToggle.innerHTML="";
    const distinct=[...new Set(altList)];
    if(distinct.length>1){
      distinct.forEach(i=>{
        const t=document.createElement("button");
        t.textContent=(ENTRIES[i].dir==="across"?"Across":"Down");
        if(i===idx)t.classList.add("on");
        t.addEventListener("click",()=>openWord(i));
        mToggle.appendChild(t);
      });
    }
    mBoxes.className="m-boxes"; mBoxes.innerHTML=""; boxes=[];
    e.cells.forEach((k,i)=>{
      const d=cellData[k];
      const inp=document.createElement("input");
      inp.className="m-box"; inp.maxLength=1; inp.autocomplete="off"; inp.inputMode="text";
      if(d.filled){ inp.value=d.filled; inp.disabled=true; inp.classList.add("lock"); }
      wire(inp,i,e);
      mBoxes.appendChild(inp); boxes.push(inp);
    });
    mMsg.className="m-msg";
    mMsg.textContent = e.solved ? "This word is already solved ✔" : "Type your answer.";
    scrim.classList.add("show");
    if(!e.solved){ const f=boxes.find(b=>!b.value); (f||boxes[0]).focus(); }
  }
  function wire(inp,i,e){
    inp.addEventListener("input",()=>{
      inp.value=inp.value.toUpperCase().replace(/[^A-Z]/g,"");
      if(inp.value){ blip(560,.05,.06); const n=boxes[i+1]; if(n)n.focus(); else tryCheck(); }
    });
    inp.addEventListener("keydown",ev=>{
      if(ev.key==="Backspace"&&!inp.value){const p=boxes[i-1];if(p){p.focus();p.value="";ev.preventDefault();}}
      else if(ev.key==="Enter") check();
      else if(ev.key==="ArrowLeft"){const p=boxes[i-1];if(p)p.focus();}
      else if(ev.key==="ArrowRight"){const n=boxes[i+1];if(n)n.focus();}
    });
  }
  function guess(){return boxes.map(b=>b.value).join("");}
  function tryCheck(){ if(boxes.every(b=>b.value)) check(); }
  function check(){
    const e=ENTRIES[cur]; if(e.solved){scrim.classList.remove("show");return;}
    if(guess()===e.word){ solve(cur); }
    else{
      mBoxes.classList.add("shake"); ding(false);
      mMsg.className="m-msg"; mMsg.textContent="Not quite… read the clue again.";
      setTimeout(()=>mBoxes.classList.remove("shake"),420);
    }
  }
  function solve(idx){
    const e=ENTRIES[idx]; e.solved=true;
    e.cells.forEach(k=>{ cellData[k].filled=cellData[k].letter; });
    paint();
    e.cells.forEach((k,i)=>setTimeout(()=>{
      const el=cellData[k].el; el.classList.add("pop"); burstFromCell(el);
      setTimeout(()=>el.classList.remove("pop"),500);
    },i*60));
    ding(true);
    buildClues();
    const done=ENTRIES.filter(x=>x.solved).length;
    $("#count").textContent=done;
    mMsg.className="m-msg ok"; mMsg.textContent="Well done! Correct ✔";
    boxes.forEach((b,i)=>{b.value=e.word[i];b.disabled=true;b.classList.add("lock");});
    setTimeout(()=>{
      scrim.classList.remove("show");
      if(done===ENTRIES.length) setTimeout(finale,450);
    },700);
  }

  $("#mCheck").addEventListener("click",check);
  $("#mClose").addEventListener("click",()=>scrim.classList.remove("show"));
  scrim.addEventListener("click",e=>{ if(e.target===scrim)scrim.classList.remove("show"); });
  $("#mHint").addEventListener("click",()=>{
    const e=ENTRIES[cur]; if(e.solved)return;
    const empt=boxes.map((b,i)=>({b,i})).filter(o=>!o.b.value);
    if(!empt.length){mMsg.className="m-msg";mMsg.textContent="No empty boxes left.";return;}
    const o=empt[0];
    o.b.value=e.word[o.i]; o.b.disabled=true; o.b.classList.add("lock"); blip(560,.05,.06);
    mMsg.className="m-msg"; mMsg.textContent="Revealed a letter 💡";
    const f=boxes.find(b=>!b.value); if(f)f.focus(); tryCheck();
  });

  // ---- sound ----
  let ac=null;
  function AC(){ if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(ac&&ac.state==="suspended")ac.resume(); return ac;}
  function blip(f,when,vol,type){const c=AC();if(!c||!soundOn)return;const o=c.createOscillator(),g=c.createGain();
    o.type=type||"sine";o.frequency.value=f;const t=c.currentTime+(when||0);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.15,t+.01);
    g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.35);}
  function ding(good){ if(good){blip(660,0,.18,"triangle");blip(990,.07,.14,"sine");} else {blip(200,0,.14,"square");blip(150,.08,.12,"square");} }
  function fanfare(){ [523,659,784,1047,1319].forEach((f,i)=>blip(f,i*.12,.16,"triangle")); blip(1047,.62,.12,"sine"); }
  $("#snd").addEventListener("click",e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?"🔊":"🔈";if(soundOn)AC();});

  // ---- finale ----
  function finale(){
    fanfare(); burstConfetti();
    const f=$("#finale"), r=$("#rev");
    f.classList.add("show");
    setTimeout(()=>r.classList.add("s1"),120);
    setTimeout(()=>r.classList.add("s2"),900);
  }
  $("#fAgain").addEventListener("click",()=>{fanfare();burstConfetti();});
  $("#fReplay").addEventListener("click",()=>{
    ENTRIES.forEach(e=>e.solved=false);
    Object.values(cellData).forEach(d=>d.filled="");
    $("#rev").classList.remove("s1","s2"); $("#finale").classList.remove("show");
    $("#count").textContent="0";
    buildGrid(); buildClues();
  });

  // ---- confetti/particle fx (word solved + finale) ----
  const fx=$("#fx"), ctx=fx.getContext("2d");
  let W,H,DPR,parts=[],running=false;
  const COLORS=["#d65a31","#222831","#393e46","#f7cdbb","#eeeeee"];
  function size(){ DPR=Math.min(2,devicePixelRatio||1);
    W=fx.width=innerWidth*DPR; H=fx.height=innerHeight*DPR;
    fx.style.width=innerWidth+"px"; fx.style.height=innerHeight+"px"; }
  function burstFromCell(el){
    const b=el.getBoundingClientRect();
    const x=(b.left+b.width/2)*DPR, y=(b.top+b.height/2)*DPR;
    for(let i=0;i<16;i++){const a=Math.random()*6.28,s=(1.5+Math.random()*4)*DPR;
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2*DPR,g:.12*DPR,life:1,dec:.02+Math.random()*.02,
        r:(2+Math.random()*3)*DPR,c:COLORS[i%COLORS.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4});}
    run();
  }
  function burstConfetti(){
    for(let i=0;i<200;i++){const x=Math.random()*W,y=-20*DPR-Math.random()*H*.5;
      parts.push({x,y,vx:(Math.random()-.5)*3*DPR,vy:(2+Math.random()*3.5)*DPR,g:.05*DPR,life:1,dec:.005+Math.random()*.005,
        r:(3+Math.random()*4)*DPR,c:COLORS[i%COLORS.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4});}
    run();
  }
  function run(){ if(!running){running=true;requestAnimationFrame(step);} }
  function step(){
    ctx.clearRect(0,0,W,H);
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];
      p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=p.dec;
      if(p.life<=0||p.y>H+40){parts.splice(i,1);continue;}
      ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
      ctx.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2);
      ctx.restore();
    }
    if(parts.length)requestAnimationFrame(step); else {ctx.clearRect(0,0,W,H);running=false;}
  }

  addEventListener("resize",size);
  size(); buildGrid(); buildClues();

  // ---- ambient falling-letters rain background ----
  (function rain(){
    const cv=$("#rain"), rc=cv.getContext("2d");
    const LETTERS="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    let dpr, w, h, cols, drops=[];
    function setup(){
      dpr=Math.min(2,devicePixelRatio||1);
      w=cv.width=innerWidth*dpr; h=cv.height=innerHeight*dpr;
      cv.style.width=innerWidth+"px"; cv.style.height=innerHeight+"px";
      const fontSize=16*dpr;
      cols=Math.floor(w/(fontSize*1.6));
      drops=Array.from({length:cols},()=>({
        y:Math.random()*-h,
        speed:(.6+Math.random()*1.1)*dpr,
        size:fontSize,
        color: Math.random()<.28 ? "rgba(214,90,49,ALPHA)" : "rgba(57,62,70,ALPHA)"
      }));
    }
    function frame(){
      rc.clearRect(0,0,w,h);
      const colw=w/cols;
      drops.forEach((d,i)=>{
        const ch=LETTERS[Math.floor(Math.random()*LETTERS.length)];
        rc.font=d.size+"px 'Space Grotesk', monospace";
        rc.fillStyle=d.color.replace("ALPHA",".16");
        rc.fillText(ch, i*colw + colw*.2, d.y);
        d.y += d.speed;
        if(d.y > h + d.size) d.y = Math.random()*-200*dpr;
      });
      requestAnimationFrame(frame);
    }
    addEventListener("resize",setup);
    setup(); requestAnimationFrame(frame);
  })();
})();
</script>
