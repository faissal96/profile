<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>GFP Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#eeeeee;
    --paper-2:#e2e2e2;
    --card:#ffffff;
    --ink:#222831;
    --ink-2:#222831;
    --muted:#6d7278;
    --accent:#d65a31;
    --accent-lite:#f7cdbb;
    --dark:#393e46;
    --line:#d8d8d8;
    --shadow:rgba(34,40,49,.14);
    --fd:"Space Grotesk",system-ui,sans-serif;
    --fb:"Poppins",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100dvh}
  body{
    font-family:var(--fb);color:var(--ink);
    background:var(--paper);
    overflow-x:hidden;
  }
  .wrap{max-width:640px;margin:0 auto;padding:22px 18px 40px;position:relative;z-index:2}

  .backlink{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;font-size:13px;font-weight:600;
    color:var(--muted);text-decoration:none}
  .backlink:hover{color:var(--ink)}

  header{text-align:center;margin:6px 0 18px}
  .bot-badge{width:54px;height:54px;border-radius:16px;background:linear-gradient(145deg,var(--accent),var(--dark));
    display:grid;place-items:center;font-size:26px;margin:0 auto 10px;box-shadow:0 10px 24px var(--shadow)}
  h1{
    font-family:var(--fd);font-weight:700;
    font-size:clamp(24px,7vw,34px);color:var(--ink);margin:0;
    letter-spacing:-.01em;
  }
  header p{margin:8px 0 0;color:var(--accent);font-size:clamp(13.5px,3.6vw,16px);font-weight:600}

  .chat-card{background:var(--card);border:1px solid var(--line);border-radius:24px;
    box-shadow:0 20px 50px var(--shadow);display:flex;flex-direction:column;
    height:min(640px,72dvh);overflow:hidden}

  .chat-top{display:flex;align-items:center;gap:10px;padding:12px 16px;
    border-bottom:1px solid var(--line);background:var(--paper);flex:0 0 auto}
  .chat-top-left{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:#3fb950;box-shadow:0 0 0 3px rgba(63,185,80,.2)}
  .lang-switch{margin-inline-start:auto;display:flex;gap:6px}
  .lang-switch button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;
    font-family:var(--fb);font-weight:700;font-size:11.5px;color:var(--muted);cursor:pointer}
  .lang-switch button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .resetbtn{border:1px solid var(--line);background:#fff;border-radius:10px;width:32px;height:32px;
    cursor:pointer;font-size:16px;color:var(--muted);flex:0 0 auto}
  .resetbtn:active{transform:scale(.94)}

  .messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
  .msg{max-width:84%;padding:10px 14px;border-radius:16px;font-size:13.8px;line-height:1.6;
    white-space:pre-line;animation:msgIn .25s ease;word-wrap:break-word}
  @keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.bot{align-self:flex-start;background:var(--paper);color:var(--ink);border-end-start-radius:4px}
  .msg.user{align-self:flex-end;background:var(--ink);color:#fff;border-end-end-radius:4px}

  .typing{align-self:flex-start;display:flex;gap:4px;padding:13px 15px;background:var(--paper);border-radius:16px}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  .chips-row{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px;flex:0 0 auto}
  .chip-btn{border:1px solid var(--accent);background:var(--accent-lite);color:var(--dark);border-radius:999px;
    padding:7px 13px;font-family:var(--fb);font-weight:600;font-size:12.3px;cursor:pointer;
    transition:transform .12s;line-height:1.3}
  .chip-btn:hover{transform:translateY(-2px)}
  .chip-btn.alt{border-color:var(--line);background:#fff;color:var(--muted)}

  .lang-pick{display:flex;gap:10px;width:100%}
  .lang-pick button{flex:1;padding:14px 8px;border-radius:14px;border:1.5px solid var(--line);background:#fff;
    font-family:var(--fd);font-weight:700;font-size:14px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
  .lang-pick button:hover{border-color:var(--accent);background:var(--accent-lite)}
  .lang-pick button span{font-size:20px}

  .inputrow{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:#fff;flex:0 0 auto}
  .inputrow input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;
    font-family:var(--fb);font-size:14px;color:var(--ink);outline:none;min-width:0}
  .inputrow input:focus{border-color:var(--accent)}
  .inputrow input:disabled{background:var(--paper);color:var(--muted)}
  .inputrow button{width:44px;height:44px;border:none;border-radius:12px;background:var(--accent);color:#fff;
    font-size:17px;cursor:pointer;display:grid;place-items:center;flex:0 0 44px}
  .inputrow button:disabled{background:var(--line);cursor:not-allowed}
  .inputrow button:active:not(:disabled){transform:scale(.94)}
  [dir="rtl"] .inputrow button span{display:inline-block;transform:scaleX(-1)}

  .foot-note{text-align:center;color:var(--muted);font-size:11.5px;margin-top:14px;line-height:1.6}
</style>
</head>
<body>

<div class="wrap">
  <a class="backlink" href="index.html" id="backlink">← Back to site</a>
  <header>
    <div class="bot-badge">🤖</div>
    <h1 id="pageTitle">GFP Assistant</h1>
    <p id="pageSub">Ask anything about the General Foundation Program</p>
  </header>

  <div class="chat-card">
    <div class="chat-top">
      <div class="chat-top-left"><span class="dot"></span><span id="statusText">Online</span></div>
      <div class="lang-switch" id="langSwitch" hidden>
        <button data-lang="ar" id="btnAr">عربي</button>
        <button data-lang="en" id="btnEn">EN</button>
      </div>
      <button class="resetbtn" id="resetBtn" title="Restart">↺</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="chips-row" id="chipsRow"></div>
    <form class="inputrow" id="inputForm">
      <input type="text" id="userInput" placeholder="Type your question..." autocomplete="off" disabled />
      <button type="submit" id="sendBtn" disabled><span>➤</span></button>
    </form>
  </div>

  <p class="foot-note" id="footNote">Built from the official UTAS-Nizwa GFP Prospectus &amp; orientation materials. For official matters, confirm with the Preparatory Studies Centre.</p>
</div>

/* precompute normalized keywords */
KB.forEach(e=>{ e._kw=e.kw.map(normalize); });

/* ---------------- Helpers ---------------- */
function normalize(s){
  if(!s) return "";
  s=s.toString().trim().toLowerCase();
  s=s.replace(/[ً-ْٰـ]/g,"");
  s=s.replace(/[إأآا]/g,"ا");
  s=s.replace(/ى/g,"ي");
  s=s.replace(/ة/g,"ه");
  s=s.replace(/[؟?!.,\/#$%\^&\*;:{}=_`~()"«»]/g," ");
  s=s.replace(/\s+/g," ").trim();
  return s;
}
function scoreEntry(inputNorm,e){
  let score=0;
  for(const kw of e._kw){
    if(!kw) continue;
    if(inputNorm===kw){ score+=4; continue; }
    if(inputNorm.includes(kw)) score+=Math.max(1,kw.split(" ").length);
  }
  return score;
}
function getMatches(inputNorm){
  return KB.map(e=>({e,score:scoreEntry(inputNorm,e)}))
           .filter(x=>x.score>0)
           .sort((a,b)=>b.score-a.score);
}

const THANKS=["شكرا","مشكور","يعطيك العافيه على المساعده","thanks","thank you","thank u"].map(normalize);
const WHOAMI=["من انت","مين انت","ايش انت","who are you","what are you","انت بوت"].map(normalize);
function includesAny(inputNorm,list){ return list.some(w=>w && inputNorm.includes(w)); }

function addChip(label,onClick,alt){
  const b=document.createElement("button");
  b.className="chip-btn"+(alt?" alt":"");
  b.type="button";
  b.textContent=label;
  b.onclick=onClick;
  chipsRow.appendChild(b);
  return b;
}
function botSay(text,delay,cb){
  showTyping();
  setTimeout(()=>{ hideTyping(); addMsg(text,"bot"); if(cb) cb(); }, delay||500);
}

/* ---------------- Flow ---------------- */
function start(){
  addMsg(STR.ar.welcome+"\n\n"+STR.en.welcome,"bot");
  clearChips();
  const row=document.createElement("div");
  row.className="lang-pick";
  const bAr=document.createElement("button");
  bAr.innerHTML="<span>🇴🇲</span>العربي";
  bAr.onclick=()=>pickLang("ar");
  const bEn=document.createElement("button");
  bEn.innerHTML="<span>🇬🇧</span>English";
  bEn.onclick=()=>pickLang("en");
  row.appendChild(bAr); row.appendChild(bEn);
  chipsRow.appendChild(row);
}

function pickLang(lang){
  LANG=lang;
  applyLangUI();
  addMsg(lang==="ar"?"العربي":"English","user");
  clearChips();
  botSay(STR[lang].afterLang,500,()=>{
    userInput.disabled=false; sendBtn.disabled=false;
    userInput.placeholder=STR[lang].placeholder;
    userInput.focus();
    showTopicChips(true);
    langSwitch.hidden=false;
    updateLangSwitchUI();
  });
}

function applyLangUI(){
  document.documentElement.lang=LANG;
  document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
  pageTitle.textContent=STR[LANG].title;
  pageSub.textContent=STR[LANG].sub;
  statusText.textContent=STR[LANG].status;
  backlink.textContent=STR[LANG].back;
  footNote.textContent=STR[LANG].foot;
  document.title=STR[LANG].title;
}
function updateLangSwitchUI(){
  btnAr.classList.toggle("on",LANG==="ar");
  btnEn.classList.toggle("on",LANG==="en");
}

function showTopicChips(withLabel){
  clearChips();
  if(withLabel){
    const lbl=document.createElement("div");
    lbl.style.cssText="width:100%;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px";
    lbl.textContent=STR[LANG].chooseTopic;
    chipsRow.appendChild(lbl);
  }
  CATS.forEach(c=>{
    addChip(c.emoji+" "+c[LANG],()=>openCategory(c));
  });
}

function openCategory(cat){
  addMsg(cat.emoji+" "+cat[LANG],"user");
  clearChips();
  const items=KB.filter(e=>e.cat===cat.id);
  botSay(cat[LANG]+" 👇",450,()=>{
    items.forEach(it=>addChip(it.t[LANG],()=>askDirect(it)));
    addChip(STR[LANG].backTopics,()=>{ clearChips(); showTopicChips(false); },true);
  });
}

function askDirect(entry,skipEcho){
  if(!skipEcho) addMsg(entry.t[LANG],"user");
  clearChips();
  botSay(entry.a[LANG],550,()=>askAnythingElse());
}

function askAnythingElse(){
  botSay(STR[LANG].anythingElse,500,()=>{
    addChip(STR[LANG].yesLabel,onYesAnythingElse);
    addChip(STR[LANG].noLabel,onNoAnythingElse,true);
  });
}
function onYesAnythingElse(){
  addMsg(STR[LANG].yesLabel,"user");
  clearChips();
  botSay(STR[LANG].yesPrompt,450,()=>showTopicChips(true));
}
function onNoAnythingElse(){
  addMsg(STR[LANG].noLabel,"user");
  clearChips();
  botSay(STR[LANG].closing,450);
}

function sendToFaisal(question){
  const body=STR[LANG].mailBody.replace("{q}",question);
  const link="mailto:"+FAISAL_EMAIL+"?subject="+encodeURIComponent(STR[LANG].mailSubject)+"&body="+encodeURIComponent(body);
  window.location.href=link;
  botSay(STR[LANG].emailOpened,500,()=>askAnythingElse());
}

function handleFallback(rawQuestion){
  clearChips();
  botSay(STR[LANG].notUnderstood,500,()=>{
    CATS.forEach(c=>addChip(c.emoji+" "+c[LANG],()=>openCategory(c)));
    addChip(STR[LANG].emailChip,()=>{ addMsg(STR[LANG].emailChip,"user"); clearChips(); sendToFaisal(rawQuestion); },true);
  });
}

function handleAmbiguous(matches){
  const top=matches[0].score;
  const cands=matches.filter(m=>m.score>=top-2).slice(0,4);
  botSay(STR[LANG].maybeMean,500,()=>{
    cands.forEach(m=>addChip(m.e.t[LANG],()=>askDirect(m.e)));
    addChip(STR[LANG].somethingElse,()=>{ clearChips(); showTopicChips(true); },true);
  });
}

function processInput(raw){
  const norm=normalize(raw);
  if(!norm){ botSay(STR[LANG].typeSomething,300); return; }
  if(includesAny(norm,GREETINGS)){ botSay(STR[LANG].greeting,450,()=>showTopicChips(false)); return; }
  if(includesAny(norm,THANKS)){ botSay(STR[LANG].thanks,450); return; }
  if(includesAny(norm,WHOAMI)){ botSay(STR[LANG].whoami,450); return; }

  const matches=getMatches(norm);
  if(matches.length===0){ handleFallback(raw); return; }
  const top=matches[0], second=matches[1];
  const confident = !second || (top.score-second.score>=2) || top.score>=5;
  if(confident){ askDirect(top.e,true); }
  else{ handleAmbiguous(matches); }
}

/* ---------------- Events ---------------- */
inputForm.addEventListener("submit",e=>{
  e.preventDefault();
  const v=userInput.value.trim();
  if(!v || !LANG) return;
  addMsg(v,"user");
  userInput.value="";
  clearChips();
  processInput(v);
});
btnAr.addEventListener("click",()=>{ if(LANG!=="ar"){ LANG="ar"; applyLangUI(); updateLangSwitchUI(); addMsg(STR.ar.langSet,"bot"); userInput.placeholder=STR.ar.placeholder; showTopicChips(false);} });
btnEn.addEventListener("click",()=>{ if(LANG!=="en"){ LANG="en"; applyLangUI(); updateLangSwitchUI(); addMsg(STR.en.langSet,"bot"); userInput.placeholder=STR.en.placeholder; showTopicChips(false);} });
resetBtn.addEventListener("click",()=>{
  messagesEl.innerHTML=""; clearChips();
  userInput.disabled=true; sendBtn.disabled=true; userInput.value="";
  langSwitch.hidden=true;
  LANG=null;
  start();
});

start();
})();
</script>
</body>
</html>
